<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversor de Moedas - América Latina</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{font-size:20px;color:#1e3c72;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:16px}
label{display:block;font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
select,input{width:100%;padding:13px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;background:#fafafa;outline:none;font-family:inherit;margin-bottom:8px}
select:focus,input:focus{border-color:#2a5298;background:#fff}
#currencySelect{font-weight:600;color:#1e3c72;cursor:pointer}
.tabs{display:flex;gap:6px;margin:14px 0;background:#f0f3f8;padding:4px;border-radius:12px}
.tab{flex:1;padding:10px;border:none;background:transparent;color:#666;font-size:13px;font-weight:700;cursor:pointer;border-radius:9px;font-family:inherit}
.tab.active{background:#fff;color:#2a5298;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mode{display:none}.mode.active{display:block}
.minimo{font-size:12px;color:#666;margin-bottom:12px;text-align:right}
.minimo b{color:#2a5298}
.erro{background:#ffecec;border:2px solid #e74c3c;color:#c0392b;border-radius:10px;padding:12px;text-align:center;font-size:13px;margin-bottom:12px;display:none}
.erro.show{display:block}
.result{background:linear-gradient(135deg,#00b894,#00a383);color:#fff;border-radius:14px;padding:20px 16px;text-align:center;display:none}
.result.show{display:block}
.result .tit{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.result .val{font-size:34px;font-weight:800;line-height:1;word-break:break-all}
.result .det{margin-top:10px;font-size:11px;opacity:.92;font-family:monospace;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:6px;display:inline-block}
.pgto{margin-top:10px;background:#fff7e6;border:2px dashed #f5a623;border-radius:10px;padding:10px;text-align:center;font-size:12px;color:#8a6d1c;display:none}
.pgto.show{display:block}
.pgto b{display:block;color:#b87800;font-size:18px;margin-top:3px}
.brl{margin-top:10px;background:#eef3fb;border:1px dashed #b9c6dd;border-radius:10px;padding:10px;text-align:center;font-size:13px;color:#2a5298;display:none}
.brl.show{display:block}
.wpp{display:none;width:100%;margin-top:12px;padding:15px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;text-align:center;box-shadow:0 6px 18px rgba(37,211,102,.35)}
.wpp.show{display:block}
.info{text-align:center;color:#666;font-size:12px;margin-top:14px;line-height:1.5}
.info b{color:#2a5298}
</style>
</head>
<body>
<div class="card">
<h1>🪙 Conversor de Moedas</h1>
<p class="sub">América Latina — escolha e converta</p>

<label for="currencySelect">💱 Moeda</label>
<select id="currencySelect"></select>

<div class="tabs">
<button class="tab active" data-m="c" id="tabC">🪙 Moedas → Moeda</button>
<button class="tab" data-m="r" id="tabR">💵 Moeda → Moedas</button>
</div>

<div id="modeC" class="mode active">
<label>Quantidade de moedas</label>
<input type="text" id="moedas" inputmode="numeric" placeholder="Ex: 6666" autofocus>
<div class="minimo" id="minC">Mínimo: <b>1.000 moedas</b></div>
<div class="erro" id="errC">⚠️ <b>Mínimo 1.000 moedas</b><br><span id="errCMsg"></span></div>
<div class="result" id="resC">
  <div class="tit">Valor exato</div>
  <div class="val" id="valC">—</div>
  <div class="det" id="detC">—</div>
</div>
<div class="pgto" id="pgtoC">💳 Para pagar <b id="pgtoCVal">—</b></div>
<div class="brl" id="brlC">💡 Em reais: <b id="brlCVal">—</b></div>
<a id="wppC" class="wpp" href="#" target="_blank">📱 Comprar pelo WhatsApp</a>
</div>

<div id="modeR" class="mode">
<label id="lblR">Valor em moeda</label>
<input type="text" id="reais" inputmode="decimal" placeholder="Ex: 20,00">
<div class="minimo" id="minR">Mínimo: —</div>
<div class="erro" id="errR">⚠️ <b>Valor mínimo</b><br><span id="errRMsg"></span></div>
<div class="result" id="resR">
  <div class="tit">Você recebe</div>
  <div class="val" id="valR">—</div>
  <div class="det" id="detR">—</div>
</div>
<div class="brl" id="brlR">💡 Em reais: <b id="brlRVal">—</b></div>
<a id="wppR" class="wpp" href="#" target="_blank">📱 Comprar pelo WhatsApp</a>
</div>

<p class="info" id="info"></p>
</div>

<script>
var WHATSAPP="5582996843269";
var REF_MOEDAS=1500,REF_PRECO=6.00,MIN=1000;
var CUSTO=REF_PRECO/REF_MOEDAS;

var MOEDAS={
ARS:{f:'🇦🇷',s:'ARS$',n:'Peso Argentino'},
BOB:{f:'🇧🇴',s:'Bs',n:'Boliviano'},
BRL:{f:'🇧🇷',s:'R$',n:'Real'},
CLP:{f:'🇨🇱',s:'CLP$',n:'Peso Chileno'},
COP:{f:'🇨🇴',s:'COP$',n:'Peso Colombiano'},
USD:{f:'🇺🇸',s:'US$',n:'Dólar'},
GYD:{f:'🇬🇾',s:'GY$',n:'Dólar Guianense'},
PYG:{f:'🇵🇾',s:'₲',n:'Guarani'},
PEN:{f:'🇵🇪',s:'S/',n:'Sol'},
SRD:{f:'🇸🇷',s:'SR$',n:'Dólar Surinamês'},
UYU:{f:'🇺🇾',s:'$U',n:'Peso Uruguaio'},
VES:{f:'🇻🇪',s:'Bs.S',n:'Bolívar'},
EUR:{f:'🇪🇺',s:'€',n:'Euro'},
BZD:{f:'🇧🇿',s:'BZ$',n:'Dólar Belize'},
CRC:{f:'🇨🇷',s:'₡',n:'Colón CR'},
GTQ:{f:'🇬🇹',s:'Q',n:'Quetzal'},
HNL:{f:'🇭🇳',s:'L',n:'Lempira'},
MXN:{f:'🇲🇽',s:'MX$',n:'Peso Mexicano'},
NIO:{f:'🇳🇮',s:'C$',n:'Córdoba'},
PAB:{f:'🇵🇦',s:'B/.',n:'Balboa'},
CUP:{f:'🇨🇺',s:'CUP$',n:'Peso Cubano'},
DOP:{f:'🇩🇴',s:'RD$',n:'Peso Dominicano'},
HTG:{f:'🇭🇹',s:'G',n:'Gourde'},
JMD:{f:'🇯🇲',s:'J$',n:'Dólar Jamaicano'},
TTD:{f:'🇹🇹',s:'TT$',n:'Dólar Trinidad'},
BSD:{f:'🇧🇸',s:'B$',n:'Dólar Bahamas'},
BBD:{f:'🇧🇧',s:'Bds$',n:'Dólar Barbados'},
XCD:{f:'🌎',s:'EC$',n:'Dólar Caribe Leste'}
};

var TAXAS={BRL:1,ARS:170,BOB:1.2,CLP:160,COP:800,USD:.17,GYD:35,PYG:1200,PEN:.65,SRD:6.5,UYU:6.5,VES:.0001,EUR:.16,BZD:.34,CRC:90,GTQ:1.3,HNL:4.2,MXN:3,NIO:6.1,PAB:.17,CUP:5,DOP:10,HTG:22,JMD:26,TTD:1.2,BSD:.17,BBD:.34,XCD:.46};

var moeda='BRL';
var fmtN=new Intl.NumberFormat('pt-BR');

function num(v){v=String(v).replace(/[^\d.,-]/g,'');if(!v)return NaN;if(v.indexOf(',')>-1)v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');var n=parseFloat(v);return isNaN(n)?NaN:n}

function fmtEx(v,c){var s=MOEDAS[c].s;if(v===0)return s+' 0,00';var t=v.toFixed(10).replace(/0+$/,'').replace(/\.$/,'');if(t.indexOf('.')<0)t+='.00';var p=t.split('.');var d=p[1]||'00';if(d.length===1)d+='0';return s+' '+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+d}

function fmtRd(v,c){try{return new Intl.NumberFormat('pt-BR',{style:'currency',currency:c}).format(v)}catch(e){return MOEDAS[c].s+' '+v.toFixed(2).replace('.',',')}}

function fmtM(v){if(Math.abs(v-Math.round(v))<.0001)return fmtN.format(Math.round(v))+' moedas';var s=v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');var p=s.split('.');return p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(p[1]?','+p[1]:'')+' moedas'}

function wpp(msg){return 'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg)}

var sel=document.getElementById('currencySelect');
Object.keys(MOEDAS).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=MOEDAS[k].f+' '+k+' — '+MOEDAS[k].n;if(k===moeda)o.selected=true;sel.appendChild(o)});

function attLabels(){var c=MOEDAS[moeda];document.getElementById('tabC').textContent='🪙 Moedas → '+c.s;document.getElementById('tabR').textContent='💵 '+c.s+' → Moedas';document.getElementById('lblR').textContent='Valor em '+c.n+' ('+c.s+')';var minV=MIN*CUSTO*TAXAS[moeda];document.getElementById('minR').innerHTML='Mínimo: <b>'+fmtRd(minV,moeda)+'</b>';document.getElementById('info').innerHTML='Referência: <b>'+fmtN.format(REF_MOEDAS)+' moedas = '+fmtRd(REF_PRECO,'BRL')+'</b><br>cada moeda = '+fmtEx(CUSTO*TAXAS[moeda],moeda)}

function calcC(){var m=num(document.getElementById('moedas').value);
var rc=document.getElementById('resC'),ec=document.getElementById('errC'),pc=document.getElementById('pgtoC'),bc=document.getElementById('brlC'),wc=document.getElementById('wppC');
rc.classList.remove('show');pc.classList.remove('show');ec.classList.remove('show');bc.classList.remove('show');wc.classList.remove('show');
if(!(m>0))return;
if(m<MIN){ec.classList.add('show');document.getElementById('errCMsg').innerHTML='Faltam <b>'+fmtN.format(MIN-m)+'</b> moedas';return}
var custo=CUSTO*TAXAS[moeda],exato=m*custo,exatoBRL=m*CUSTO;
document.getElementById('valC').textContent=fmtEx(exato,moeda);
document.getElementById('detC').textContent=fmtN.format(m)+' × '+fmtEx(custo,moeda)+' = '+fmtEx(exato,moeda);
rc.classList.add('show');
var p=Math.round(exato*100)/100;
if(Math.abs(exato-p)>.0001){pc.classList.add('show');document.getElementById('pgtoCVal').textContent=fmtRd(p,moeda)}
if(moeda!=='BRL'){bc.classList.add('show');document.getElementById('brlCVal').textContent=fmtEx(exatoBRL,'BRL')}
var msg='Olá! Vim pelo site.\n\n🪙 *Quero:* '+fmtN.format(Math.round(m))+' moedas\n💰 *Valor:* '+fmtRd(p,moeda)+'\n';
if(moeda!=='BRL')msg+='💡 *Em reais:* '+fmtRd(Math.round(exatoBRL*100)/100,'BRL')+'\n';
msg+='\nPodemos combinar?';
wc.href=wpp(msg);wc.classList.add('show')}

function calcR(){var v=num(document.getElementById('reais').value);
var rr=document.getElementById('resR'),er=document.getElementById('errR'),br=document.getElementById('brlR'),wr=document.getElementById('wppR');
rr.classList.remove('show');er.classList.remove('show');br.classList.remove('show');wr.classList.remove('show');
if(!(v>0))return;
var custo=CUSTO*TAXAS[moeda],mq=v/custo;
if(mq<MIN-.01){er.classList.add('show');var minV=MIN*custo;document.getElementById('errRMsg').innerHTML='Faltam <b>'+fmtRd(minV-v,moeda)+'</b>';return}
var mi=Math.round(mq),inteira=Math.abs(mq-mi)<.0001,mf=inteira?mi:mq;
document.getElementById('valR').textContent=fmtM(mf);
document.getElementById('detR').textContent=fmtRd(v,moeda)+' ÷ '+fmtEx(custo,moeda)+' = '+fmtM(mf);
rr.classList.add('show');
var vBRL=v/TAXAS[moeda];
if(moeda!=='BRL'){br.classList.add('show');document.getElementById('brlRVal').textContent=fmtRd(vBRL,'BRL')}
var qtd=inteira?mi:Math.floor(mf);
var msg='Olá! Vim pelo site.\n\n💵 *Quero:* '+fmtRd(v,moeda)+' em moedas\n🪙 *Equivale:* '+fmtN.format(qtd)+' moedas\n';
if(moeda!=='BRL')msg+='💡 *Em reais:* '+fmtRd(vBRL,'BRL')+'\n';
msg+='\nPodemos combinar?';
wr.href=wpp(msg);wr.classList.add('show')}

sel.addEventListener('change',function(e){moeda=e.target.value;attLabels();calcC();calcR()});
document.getElementById('moedas').addEventListener('input',calcC);
document.getElementById('reais').addEventListener('input',calcR);

document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});t.classList.add('active');var m=t.dataset.m;document.getElementById('modeC').classList.toggle('active',m==='c');document.getElementById('modeR').classList.toggle('active',m==='r')})});

attLabels();
fetch('https://open.er-api.com/v6/latest/BRL').then(function(r){return r.json()}).then(function(d){if(d&&d.rates){Object.keys(MOEDAS).forEach(function(k){if(k!=='BRL'&&d.rates[k]>0)TAXAS[k]=d.rates[k]});attLabels();calcC();calcR()}}).catch(function(){});
</script>
</body>
        </html>
