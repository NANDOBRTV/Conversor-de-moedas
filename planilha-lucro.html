<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://esm.sh; connect-src 'self' https://esm.sh https://kllewmcyvjltfzqxnmyz.supabase.co; frame-src 'self' about:;">
<title>Planilha de Lucro | Conversor Sanba</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081427;color:#ebf8ff;font:16px/1.55 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px 15px}nav{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#8ce7ff}h1{font-size:clamp(24px,5vw,38px);line-height:1.2}#status{border:1px solid #315671;background:#102846;border-radius:14px;padding:20px;margin:18px 0}#status.error{border-color:#b04b5b;background:#381e2b}#premiumFrame{display:none;width:100%;height:75vh;min-height:600px;background:#fff;border:0;border-radius:14px}#premiumFrame.ready{display:block}small{color:#a0b4cb}
</style>
<script src="./supabase-config.js"></script>
</head>
<body>
<main>
<nav><strong>Conversor Sanba · Conteúdo protegido</strong><a href="./cliente.html">Voltar à minha conta</a></nav>
<h1>Planilha de Lucro</h1>
<p>Este produto é entregue após confirmação do pagamento e validação da conta.</p>
<div id="status" role="status">Verificando a sessão e a licença do produto…</div>
<iframe id="premiumFrame" sandbox="allow-scripts" referrerpolicy="no-referrer" title="Planilha de Lucro"></iframe>
<small>O material não é incluído no código público do site. A liberação é confirmada no servidor.</small>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const config=window.SANBA_SUPABASE_CONFIG||{};
const status=document.getElementById('status');
const frame=document.getElementById('premiumFrame');
function fail(message){status.className='error';status.textContent=message;}
try{
  if(!config.url||!config.anonKey)throw new Error('Configuração de autenticação indisponível.');
  const client=createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:{session},error:sessionError}=await client.auth.getSession();
  if(sessionError||!session)throw new Error('Entre na sua conta para abrir este produto.');
  const {data,error}=await client.functions.invoke('get-premium-content',{body:{product_code:'planilha_lucro'}});
  if(error||!data?.ok||typeof data.html!=='string')
    throw new Error(data?.error||'Não foi possível confirmar a licença ou carregar o conteúdo.');
  if(data.html.length>1024*1024)throw new Error('O conteúdo excede o tamanho permitido.');
  frame.srcdoc=data.html;
  frame.classList.add('ready');
  status.remove();
}catch(error){fail(error?.message||'Não foi possível abrir o conteúdo protegido.');}
</script>
</body>
</html>
